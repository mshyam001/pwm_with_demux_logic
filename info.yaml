# Tiny Tapeout project information
project:
  title:        "PWM Generator"      # Project title
  author:       "Shyam Sunder Mandapally"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "PWM Generator with demux logic"      # One line description of what your project does
  language:     "VHDL"  # other examples include Verilog, SystemVerilog, Amaranth, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_VHDL_PWM_DEMUX"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  #
  # WARNING: VHDL support in Tiny Tapeout is experimental. The template may get changes during
  #          the shuttle and VHDL support may be dropped for future shuttles if we see low usage.
  source_files:
    - "project.vhdl"
    - "pwm_demux.vhdl"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
ui[0]: "DATA0 - config data LSB"
ui[1]: "DATA1 - config data"
ui[2]: "DATA2 - config data"
ui[3]: "DATA3 - config data"
ui[4]: "DATA4 - config data"
ui[5]: "DATA5 - config data"
ui[6]: "DATA6 - config data"
ui[7]: "DATA7 - config data MSB"

# Outputs

uo[0]: "PWM_O - PWM waveform (active high)"
uo[1]: "unused (driven 0)"
uo[2]: "unused (driven 0)"
uo[3]: "unused (driven 0)"
uo[4]: "unused (driven 0)"
uo[5]: "unused (driven 0)"
uo[6]: "unused (driven 0)"
uo[7]: "unused (driven 0)"

#Bidirectional pins

uio[0]: "SEL0 - select LSB (00=set, 01=clear, 10=reload)"
uio[1]: "SEL1 - select MSB"
uio[2]: "WR - 1-cycle write strobe"
uio[3]: "COMMIT - 1-cycle apply shadows to active"
uio[4]: "unused (input only)"
uio[5]: "unused (input only)"
uio[6]: "unused (input only)"
uio[7]: "unused (input only)"

# Do not change!
yaml_version: 6
